<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vibe Todo — Light Tomato & Blue</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1>Vibe Todo</h1>
        <p class="subtitle">Light tomato + blue — a modern, minimal todo app</p>
      </div>
    </header>

    <main>
      <section class="new-todo">
        <input id="todo-input" aria-label="New todo" placeholder="What do you want to do?" />
        <button id="add-btn" class="btn primary">Add</button>
      </section>

      <section class="controls">
        <div class="filters" role="tablist" aria-label="Filter todos">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="active">Active</button>
          <button class="filter" data-filter="completed">Completed</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button id="load-demo" class="btn" title="Load demo todos">Load demo</button>
          <button id="clear-completed" class="btn" title="Remove completed todos">Clear completed</button>
        </div>
      </section>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <footer class="footer">
        <div id="count" class="count">0 items</div>
      </footer>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
